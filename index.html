<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Birthday Surprise</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #05020a;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: #ffffff;
        }

        /* 1. 3D Interactive Neon Core */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            z-index: 1;
            mix-blend-mode: screen;
        }
        .orb-1 { width: 350px; height: 350px; background: #ff0055; top: -50px; left: -50px; }
        .orb-2 { width: 400px; height: 400px; background: #00f2fe; bottom: -100px; right: -100px; }
        .orb-3 { width: 300px; height: 300px; background: #7928ca; top: 40%; left: 30%; }

        /* 5. Hyper-Realistic Fluid Heart Rain Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Container & Glassmorphism */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 380px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.05);
            text-align: center;
        }

        /* 2. Glassmorphic Security Box (Android Optimized Keypad Lock) */
        .lock-screen h2 {
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 15px;
            color: #eaeaea;
            letter-spacing: 0.5px;
        }
        
        /* एंड्रॉइड के लिए नंबर दिखने वाला डिस्प्ले बॉक्स */
        .passcode-display {
            width: 100%;
            max-width: 200px;
            height: 45px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            letter-spacing: 8px;
            font-weight: 600;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            justify-items: center;
            max-width: 280px;
            margin: 0 auto;
        }

        .key {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s;
        }

        .key:active {
            background: rgba(255, 255, 255, 0.25);
        }

        .key span { font-size: 1.6rem; font-weight: 400; color: #fff; }
        .key small { font-size: 0.65rem; color: rgba(255,255,255,0.5); letter-spacing: 1px; margin-top: -2px; }

        /* Error Shake */
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* 3. Cinematic Text Flow & Smoke/Neon Reveal */
        .main-content { display: none; opacity: 0; transition: opacity 1s ease; }
        
        .cinematic-text-box {
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .poetry-line {
            position: absolute;
            width: 100%;
            opacity: 0;
            filter: blur(20px) brightness(2);
            transform: scale(0.9) translateY(10px);
            transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            font-size: 1.25rem;
            line-height: 1.8;
            font-weight: 400;
            color: #fff;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.8), 0 0 30px rgba(0, 242, 254, 0.4);
        }

        .poetry-line.active {
            opacity: 1;
            filter: blur(0px) brightness(1);
            transform: scale(1) translateY(0);
        }

        .poetry-line.exit {
            opacity: 0;
            filter: blur(25px) brightness(0.5);
            transform: scale(1.05) translateY(-15px);
        }

        .highlight {
            background: linear-gradient(135deg, #00f2fe 0%, #ff007f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        #youtube-player-container { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
    </style>
</head>
<body>

    <!-- 1. Background Core Components -->
    <div class="orb orb-1" id="orb1"></div>
    <div class="orb orb-2" id="orb2"></div>
    <div class="orb orb-3" id="orb3"></div>

    <!-- 5. Fluid Canvas -->
    <canvas id="heartCanvas"></canvas>

    <!-- 4. Hidden Cinematic Audio (YouTube API Player) -->
    <div id="youtube-player-container"><div id="player"></div></div>

    <!-- Main Dynamic Glass Box -->
    <div class="container" id="mainContainer">
        
        <!-- 2. Android Optimized Passcode Lock Screen -->
        <div class="lock-screen" id="lockScreen">
            <h2>Enter Passcode</h2>
            <!-- नंबर दिखने वाला बॉक्स (Android Fix) -->
            <div class="passcode-display" id="passCodeBox"></div>
            
            <div class="keypad">
                <div class="key" onclick="pressKey('1')"><span>1</span><small>&nbsp;</small></div>
                <div class="key" onclick="pressKey('2')"><span>2</span><small>ABC</small></div>
                <div class="key" onclick="pressKey('3')"><span>3</span><small>DEF</small></div>
                <div class="key" onclick="pressKey('4')"><span>4</span><small>GHI</small></div>
                <div class="key" onclick="pressKey('5')"><span>5</span><small>JKL</small></div>
                <div class="key" onclick="pressKey('6')"><span>6</span><small>MNO</small></div>
                <div class="key" onclick="pressKey('7')"><span>7</span><small>PQRS</small></div>
                <div class="key" onclick="pressKey('8')"><span>8</span><small>TUV</small></div>
                <div class="key" onclick="pressKey('9')"><span>9</span><small>WXYZ</small></div>
                <div class="key" style="opacity: 0; pointer-events: none;"></div>
                <div class="key" onclick="pressKey('0')"><span>0</span><small>&nbsp;</small></div>
                <div class="key" onclick="clearPasscode()"><span style="font-size:0.9rem; font-weight:600;">DEL</span></div>
            </div>
        </div>

        <!-- 3. Cinematic Presentation Box -->
        <div class="main-content" id="mainContent">
            <div class="cinematic-text-box" id="textFlowBox">
                <!-- Lines will fluidly fade in/out here -->
            </div>
        </div>

    </div>

    <script>
        // 2. Audio Mechanics (Tick Sound) & Vibrations
        let audioCtx;
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTickSound() {
            try {
                initAudioContext();
                if (audioCtx && audioCtx.state !== 'suspended') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                }
            } catch(e) { console.log(e); }
        }

        function triggerVibration() {
            if (navigator.vibrate) navigator.vibrate(15);
        }

        // Passcode Target Definition
        const CORRECT_PASSCODE = "2026"; 
        let currentInput = "";

        function pressKey(num) {
            if (currentInput.length >= 4) return;
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            playTickSound();
            triggerVibration();
            currentInput += num;
            updateDisplay();
