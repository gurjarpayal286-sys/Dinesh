<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Birthday Surprise</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #05020a;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: #ffffff;
        }

        /* 3D Interactive Neon Core */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            z-index: 1;
            mix-blend-mode: screen;
        }
        .orb-1 { width: 350px; height: 350px; background: #ff0055; top: -50px; left: -50px; }
        .orb-2 { width: 400px; height: 400px; background: #00f2fe; bottom: -100px; right: -100px; }
        .orb-3 { width: 300px; height: 300px; background: #7928ca; top: 40%; left: 30%; }

        /* Floating Heart Rain Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Container & Glassmorphism */
        .container {
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 360px;
            padding: 40px 25px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
            text-align: center;
            transition: all 0.5s ease;
        }

        /* Android Fix: Direct Unlock Magic Button */
        .lock-screen h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .lock-screen p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }

        .magic-btn {
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(135deg, #00f2fe 0%, #ff007f 100%);
            border: none;
            outline: none;
            border-radius: 16px;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .magic-btn:active {
            transform: scale(0.96);
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.3);
        }

        /* Cinematic Text Flow & Smoke/Neon Reveal */
        .main-content { display: none; opacity: 0; transition: opacity 1s ease; }
        
        .cinematic-text-box {
            min-height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .poetry-line {
            position: absolute;
            width: 100%;
            opacity: 0;
            filter: blur(20px) brightness(2);
            transform: scale(0.9) translateY(10px);
            transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            font-size: 1.25rem;
            line-height: 1.8;
            font-weight: 400;
            color: #fff;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.8), 0 0 30px rgba(0, 242, 254, 0.4);
        }

        .poetry-line.active {
            opacity: 1;
            filter: blur(0px) brightness(1);
            transform: scale(1) translateY(0);
        }

        .poetry-line.exit {
            opacity: 0;
            filter: blur(25px) brightness(0.5);
            transform: scale(1.05) translateY(-15px);
        }

        .highlight {
            background: linear-gradient(135deg, #00f2fe 0%, #ff007f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        #youtube-player-container { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
    </style>
</head>
<body>

    <!-- Background Core Components -->
    <div class="orb orb-1" id="orb1"></div>
    <div class="orb orb-2" id="orb2"></div>
    <div class="orb orb-3" id="orb3"></div>

    <!-- Fluid Canvas -->
    <canvas id="heartCanvas"></canvas>

    <!-- Hidden Cinematic Audio (YouTube API Player) -->
    <div id="youtube-player-container"><div id="player"></div></div>

    <!-- Main Dynamic Glass Box -->
    <div class="container" id="mainContainer">
        
        <!-- Direct Unlock Screen (Android 100% Fix) -->
        <div class="lock-screen" id="lockScreen">
            <h2>🎁 A Special Gift For You</h2>
            <p>Click below to unlock the magic surprise</p>
            <button class="magic-btn" onclick="unlockApp()">
                <span>✨ Unlock Magic</span>
            </button>
        </div>

        <!-- Cinematic Presentation Box -->
        <div class="main-content" id="mainContent">
            <div class="cinematic-text-box" id="textFlowBox">
                <!-- Lines will fluidly fade in/out here -->
            </div>
        </div>

    </div>

    <script>
        function triggerVibration() {
            if (navigator.vibrate) navigator.vibrate(20);
        }

        // Android Seamless Audio Setup (YouTube Player API)
        var tag = document.createElement('script');
        tag.src = "https://youtube.com";
        var firstScriptTag = document.getElementsByTagName('script');
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '1', width: '1',
                videoId: 'QwLQ4_gkvsE', // किशोर कुमार - पल पल दिल के पास
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'rel': 0, 'playsinline': 1 },
                events: { 'onReady': function(e) { e.target.mute(); } }
            });
        }

        // Direct Button Unlock
        function unlockApp() {
            triggerVibration();
            
            if (player && typeof player.playVideo === 'function') {
                player.unMute();
                player.setVolume(100);
                player.playVideo();
            }

            document.getElementById('lockScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('lockScreen').style.display = 'none';
                const mainContent = document.getElementById('mainContent');
                mainContent.style.display = 'block';
                setTimeout(() => {
                    mainContent.style.opacity = '1';
                    startInteractiveMovement();
                    startHeartRain();
                    startCinematicPoetry();
                }, 50);
            }, 400);
        }

        // Move Orbs Smoothly via Touch/Mouse Post-Unlock
        function startInteractiveMovement() {
            const handleMove = (clientX, clientY) => {
                const x = (clientX / window.innerWidth) * 40 - 20;
                const y = (clientY / window.innerHeight) * 40 - 20;
                document.getElementById('orb1').style.transform = `translate(${x}px, ${y}px)`;
                document.getElementById('orb2').style.transform = `translate(${-x}px, ${-y}px)`;
            };
            
            document.body.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
            document.body.addEventListener('touchmove', (e) => {
                if(e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY);
            });
        }

        // Cinematic Smoke & Neon Text Flow Engine
        const poetryLines = [
            "आज का दिन कुछ खास है...",
            "दुआ है मेरी, खुशियां हमेशा आपके पास हों। ✨",
            "हर लम्हा महके आपकी मुस्कान से,",
            "जन्मदिन मुबारक हो मेरे <span class='highlight'>सबसे प्यारे दोस्त</span> को! 🎉"
        ];

        function startCinematicPoetry() {
            const container = document.getElementById('textFlowBox');
            let dynamicIndex = 0;

            function showNextLine() {
                if (dynamicIndex >= poetryLines.length) return;

                const lineDiv = document.createElement('div');
                lineDiv.className = 'poetry-line';
                lineDiv.innerHTML = poetryLines[dynamicIndex];
                container.appendChild(lineDiv);

                setTimeout(() => lineDiv.classList.add('active'), 50);

                setTimeout(() => {
                    lineDiv.classList.remove('active');
                    lineDiv.classList.add('exit');
                    setTimeout(() => lineDiv.remove(), 1500);
                    
                    dynamicIndex++;
                    setTimeout(showNextLine, 500);
                }, 3500);
            }
